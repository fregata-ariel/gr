[project]
name = "gr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.0",
    "networkx>=3.6.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ty>=0.0.51",
]
train = [
    "array-record>=0.8.3 ; sys_platform == 'linux'",
    "flax>=0.12.7",
    "grain>=0.2.18 ; sys_platform == 'linux'",
    "jax>=0.10.2",
    "optax>=0.2.8",
    "orbax-checkpoint>=0.12.1",
]
